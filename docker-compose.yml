services:
  postgres:
    image: postgres:16-alpine
    container_name: office-platform-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-office_platform}
      POSTGRES_USER: ${POSTGRES_USER:-office_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-office_platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-office_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - office-platform-net

  minio:
    image: minio/minio:latest
    container_name: office-platform-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - office-platform-net

  onlyoffice:
    image: onlyoffice/documentserver:8.2
    container_name: office-platform-onlyoffice
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-changeme-onlyoffice-secret-key32}
    ports:
      - "8081:80"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
    networks:
      - office-platform-net

  office-platform-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: office-platform-app
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-office_platform}
      POSTGRES_USER: ${POSTGRES_USER:-office_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-office_platform}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-changeme-onlyoffice-secret-key32}
      # Must carry a real value, not an empty string: Compose exports the variable either way, and
      # a variable that is set-but-empty defeats the ${VAR:default} fallback in application.yml,
      # so the application received "" and the browser fell back to a relative /web-apps path.
      ONLYOFFICE_PUBLIC_URL: ${ONLYOFFICE_PUBLIC_URL:-http://localhost:8081}
      APP_INTERNAL_URL: http://office-platform-app:8080
      OFFICE_PLATFORM_PUBLIC_URL: ${OFFICE_PLATFORM_PUBLIC_URL:-http://office-platform-app:8080}
      OFFICE_PLATFORM_CORS_ALLOWED_ORIGINS: ${OFFICE_PLATFORM_CORS_ALLOWED_ORIGINS:-*}
      # Universal decentralized storage: widen the allowed MIME list so the manager
      # accepts emails (.eml/.msg), CAD drawings (.dwg/.dxf), archives, images and
      # arbitrary binaries (octet-stream) in addition to Office/PDF. Comma-separated,
      # NO spaces (the service does allowedMimeTypesRaw.split(",") with exact match).
      # Overrides application.yml office-platform.storage.allowed-mime-types via
      # Spring relaxed binding. Rollback: remove this line and restart the container.
      OFFICE_PLATFORM_STORAGE_ALLOWED_MIME_TYPES: "application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,message/rfc822,application/vnd.ms-outlook,application/octet-stream,application/zip,application/x-zip-compressed,application/x-rar-compressed,application/x-7z-compressed,application/gzip,application/x-tar,image/png,image/jpeg,image/gif,image/webp,image/svg+xml,image/bmp,image/tiff,image/vnd.dwg,image/vnd.dxf,application/acad,application/dxf,application/dwg,application/x-dwg,application/x-autocad,text/plain,text/csv,application/json,application/xml,text/xml,application/vnd.oasis.opendocument.text,application/vnd.oasis.opendocument.spreadsheet,application/vnd.oasis.opendocument.presentation,application/rtf,text/html"
    ports:
      - "8080:8080"
    volumes:
      - ./backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      onlyoffice:
        condition: service_started
    networks:
      - office-platform-net

volumes:
  postgres_data:
  minio_data:
  onlyoffice_data:

networks:
  office-platform-net:
    driver: bridge
