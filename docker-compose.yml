services:
  postgres:
    image: postgres:16-alpine
    container_name: office-platform-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-office_platform}
      POSTGRES_USER: ${POSTGRES_USER:-office_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-office_platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-office_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - office-platform-net

  minio:
    image: minio/minio:latest
    container_name: office-platform-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - office-platform-net

  onlyoffice:
    image: onlyoffice/documentserver:8.2
    container_name: office-platform-onlyoffice
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-changeme-onlyoffice-secret-key32}
    ports:
      - "8081:80"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      # Plugins mounted from the repository instead of living in the container writable
      # layer, where they were lost the moment the container was recreated. The image
      # ships none of them even though plugin-list-default.json declares them, so without
      # this the Extensiones tab is empty and the Macros button never appears.
      # Mounted one by one: mounting the parent directory would hide marketplace/, v1/
      # and pluginBase.js, which the editor needs.
      - "./onlyoffice-plugins/{07FD8DFA-DFE0-4089-AL24-0730933CC80A}:/var/www/onlyoffice/documentserver/sdkjs-plugins/{07FD8DFA-DFE0-4089-AL24-0730933CC80A}:ro"
      - "./onlyoffice-plugins/{38E022EA-AD92-45FC-B22B-49DF39746DB4}:/var/www/onlyoffice/documentserver/sdkjs-plugins/{38E022EA-AD92-45FC-B22B-49DF39746DB4}:ro"
      - "./onlyoffice-plugins/{440EBF13-9B19-4BD8-8621-05200E58140B}:/var/www/onlyoffice/documentserver/sdkjs-plugins/{440EBF13-9B19-4BD8-8621-05200E58140B}:ro"
      - "./onlyoffice-plugins/{7327FC95-16DA-41D9-9AF2-0E7F449F6800}:/var/www/onlyoffice/documentserver/sdkjs-plugins/{7327FC95-16DA-41D9-9AF2-0E7F449F6800}:ro"
      - "./onlyoffice-plugins/{BE5CBF95-C0AD-4842-B157-AC40FEDD9441}:/var/www/onlyoffice/documentserver/sdkjs-plugins/{BE5CBF95-C0AD-4842-B157-AC40FEDD9441}:ro"
      - "./onlyoffice-plugins/{BE5CBF95-C0AD-4842-B157-AC40FEDD9840}:/var/www/onlyoffice/documentserver/sdkjs-plugins/{BE5CBF95-C0AD-4842-B157-AC40FEDD9840}:ro"
      - "./onlyoffice-plugins/{BE5CBF95-C0AD-4842-B157-AC40FEDD9841}:/var/www/onlyoffice/documentserver/sdkjs-plugins/{BE5CBF95-C0AD-4842-B157-AC40FEDD9841}:ro"
      - "./onlyoffice-plugins/{BFC5D5C6-89DE-4168-9565-ABD8D1E48711}:/var/www/onlyoffice/documentserver/sdkjs-plugins/{BFC5D5C6-89DE-4168-9565-ABD8D1E48711}:ro"
      - "./onlyoffice-plugins/{D71C2EF0-F15B-47C7-80E9-86D671F9C595}:/var/www/onlyoffice/documentserver/sdkjs-plugins/{D71C2EF0-F15B-47C7-80E9-86D671F9C595}:ro"
      - "./onlyoffice-plugins/{DB38923B-A8C0-4DE9-8AEE-A61BB5C901A5}:/var/www/onlyoffice/documentserver/sdkjs-plugins/{DB38923B-A8C0-4DE9-8AEE-A61BB5C901A5}:ro"
      - "./onlyoffice-plugins/{E6978D28-0441-4BD7-8346-82FAD68BCA3B}:/var/www/onlyoffice/documentserver/sdkjs-plugins/{E6978D28-0441-4BD7-8346-82FAD68BCA3B}:ro"
    networks:
      - office-platform-net

  office-platform-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: office-platform-app
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-office_platform}
      POSTGRES_USER: ${POSTGRES_USER:-office_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-office_platform}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-changeme-onlyoffice-secret-key32}
      # Must carry a real value, not an empty string: Compose exports the variable either way, and
      # a variable that is set-but-empty defeats the ${VAR:default} fallback in application.yml,
      # so the application received "" and the browser fell back to a relative /web-apps path.
      ONLYOFFICE_PUBLIC_URL: ${ONLYOFFICE_PUBLIC_URL:-http://localhost:8081}
      APP_INTERNAL_URL: http://office-platform-app:8080
      OFFICE_PLATFORM_PUBLIC_URL: ${OFFICE_PLATFORM_PUBLIC_URL:-http://office-platform-app:8080}
      OFFICE_PLATFORM_CORS_ALLOWED_ORIGINS: ${OFFICE_PLATFORM_CORS_ALLOWED_ORIGINS:-*}
      # Universal decentralized storage: widen the allowed MIME list so the manager
      # accepts emails (.eml/.msg), CAD drawings (.dwg/.dxf), archives, images and
      # arbitrary binaries (octet-stream) in addition to Office/PDF. Comma-separated,
      # NO spaces (the service does allowedMimeTypesRaw.split(",") with exact match).
      # Overrides application.yml office-platform.storage.allowed-mime-types via
      # Spring relaxed binding. Rollback: remove this line and restart the container.
      OFFICE_PLATFORM_STORAGE_ALLOWED_MIME_TYPES: "application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,message/rfc822,application/vnd.ms-outlook,application/octet-stream,application/zip,application/x-zip-compressed,application/x-rar-compressed,application/x-7z-compressed,application/gzip,application/x-tar,image/png,image/jpeg,image/gif,image/webp,image/svg+xml,image/bmp,image/tiff,image/vnd.dwg,image/vnd.dxf,application/acad,application/dxf,application/dwg,application/x-dwg,application/x-autocad,text/plain,text/csv,application/json,application/xml,text/xml,application/vnd.oasis.opendocument.text,application/vnd.oasis.opendocument.spreadsheet,application/vnd.oasis.opendocument.presentation,application/rtf,text/html"
    ports:
      - "8080:8080"
    volumes:
      - ./backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      onlyoffice:
        condition: service_started
    networks:
      - office-platform-net

volumes:
  postgres_data:
  minio_data:
  onlyoffice_data:

networks:
  office-platform-net:
    driver: bridge
