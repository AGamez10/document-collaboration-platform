# Test-only overrides. Keeps the suite self-contained: no PostgreSQL, no MinIO,
# no OnlyOffice. Production configuration lives in src/main/resources/application.yml.

spring.datasource.url=jdbc:h2:mem:office_platform_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# The scheduler would otherwise write real ZIP files while the suite runs.
office-platform.backup.auto-enabled=false
office-platform.backup.directory=target/test-backups

# Secrets must be long enough for HS256; these are throwaway values for tests only.
office-platform.onlyoffice.jwt.secret=test-only-onlyoffice-secret-key-32chars
office-platform.widget-token.secret=test-only-widget-token-secret-32chars

logging.level.root=WARN
logging.level.com.officeplatform=WARN
